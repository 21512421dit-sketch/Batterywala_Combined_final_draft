<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/portal.css"><link rel="stylesheet" href="/static/portal-updates.css"><title>Change password</title></head>
<body class="portal-body"><main class="portal-card password-card"><p class="kicker">Account security</p><h1>Change password</h1><p>We will email a one-time code to {{current_user.email}}. The code expires in 10 minutes.</p>
{% for category,message in get_flashed_messages(with_categories=true) %}<p class="status {{'error' if category=='error' else 'success'}}" role="status">{{message}}</p>{% endfor %}
<form method="post"><input type="hidden" name="csrf" value="{{csrf_token}}"><input type="hidden" name="action" value="send_code"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><button class="button secondary" type="submit">Email me a code</button></form>
<form method="post"><input type="hidden" name="csrf" value="{{csrf_token}}"><input type="hidden" name="action" value="change"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>8-digit email code<input name="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" required></label><label>New password<input type="password" name="new_password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>Confirm new password<input type="password" name="confirm_password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button class="button" type="submit">Change password</button></form>
<p><a href="{{url_for('main.admin') if current_user.is_admin else url_for('portal.workspace')}}">Return to workspace</a></p></main></body></html>
